<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- What crawlers and link previews read: the pages set their own title
		     only once the app runs in the browser. -->
		<title>Fantasy City Warbands</title>
		<meta
			name="description"
			content="Build a warband for Black Death City or Wyrdcry, play its battles from a deck of cards and carry it through a campaign. An unofficial fan project."
		/>
		<meta property="og:title" content="Fantasy City Warbands" />
		<meta
			property="og:description"
			content="Build a warband for Black Death City or Wyrdcry, play its battles from a deck of cards and carry it through a campaign. An unofficial fan project."
		/>
		<!-- The icons live in static/; %sveltekit.assets% carries the base path on
		     GitHub Pages. The manifest's own paths are relative to it. -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96-v3.png" sizes="96x96" />
		<link rel="icon" href="%sveltekit.assets%/favicon-v3.ico" sizes="any" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon-v3.png" />
		<meta name="apple-mobile-web-app-title" content="Warbands" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<script>
			(() => {
				let theme = null;
				try {
					theme = localStorage.getItem('theme');
				} catch {}
				if (theme !== 'light' && theme !== 'dark')
					theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		<!-- The start screen stands until the app has loaded and src/lib/start-screen.ts
		     fades it out. Its colour is a fixed red, the same for every game. A
		     warband opened from a scanned code goes without it. -->
		<script>
			(() => {
				if (/\/view(\.html)?\/?$/.test(location.pathname)) return;
				const root = document.documentElement;
				root.classList.add('start');
				const etching = document.createElement('link');
				etching.rel = 'preload';
				etching.as = 'image';
				etching.href = '%sveltekit.assets%/start-screen-v2.webp';
				etching.fetchPriority = 'high';
				document.head.append(etching);
			})();
		</script>
		<link rel="preload" href="%sveltekit.assets%/GrenzeGotisch-Regular.ttf" as="font" type="font/ttf" crossorigin />
		<style>
			@font-face {
				font-family: 'Grenze Gotisch Start';
				src: url('%sveltekit.assets%/GrenzeGotisch-Regular.ttf') format('truetype');
			}
			/* What Safari shows when the page is pulled past its edge, and the
			   colour of its bars: it tints them after fixed elements at the edges,
			   else after this, and lags behind when that colour fades – so the
			   screen is not fixed. The fallbacks are app.css's --ui-page for the
			   frames before it loads. */
			html {
				background-color: var(--ui-page, oklch(21% 0.006 285.885));
			}
			html[data-theme='light'] {
				background-color: var(--ui-page, #e4ddd3);
			}
			html.start:has(#start-screen:not(.gone)) {
				overflow: hidden;
			}
			html:not(.start) #start-screen {
				display: none;
			}
			/* The etching is a crop of 1710 × 2600 px. It stands 1.43 times the
			   screen's height, or wider on a wide screen, so that Death sits at the
			   top and the soldier's face below the logos on a phone. */
			#start-screen {
				--h: max(143dvh, 178vw);
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100dvh;
				z-index: 100;
				overflow: hidden;
				transition: opacity 0.7s;
			}
			/* The colour lies on a child: Safari reads it off a fixed or bare screen. */
			#start-screen .ground {
				position: absolute;
				inset: 0;
				background: #fb2702;
			}
			/* It keeps catching taps while it fades, so none reaches what lies beneath. */
			#start-screen.gone {
				opacity: 0;
			}
			#start-screen .etching {
				position: absolute;
				top: calc(var(--h) * -0.021);
				left: calc(var(--h) * -0.096);
				width: calc(var(--h) * 1710 / 2600);
				height: var(--h);
				background: url('%sveltekit.assets%/start-screen-v2.webp') 0 0 / 100% 100%;
				transform-origin: 50% 0;
				animation: start-travel 3s cubic-bezier(0.2, 0.6, 0.2, 1) both;
			}
			#start-screen .title {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 4vh;
				padding-bottom: 6vh;
				color: #fff;
				font-family: 'Grenze Gotisch Start', serif;
				text-align: center;
			}
			#start-screen p {
				margin: 0;
				font-size: 30px;
				line-height: 1.15;
			}
			#start-screen p span {
				display: block;
				animation: start-in 0.7s both;
			}
			#start-screen p span:nth-child(1) {
				animation-delay: 0.7s;
			}
			#start-screen p span:nth-child(2) {
				animation-delay: 1.1s;
			}
			#start-screen p span:nth-child(3) {
				animation-delay: 1.5s;
			}
			#start-screen .logos {
				display: flex;
				align-items: center;
				gap: 24px;
			}
			#start-screen .logos div {
				background: 0 0 / 100% 100% no-repeat;
				filter: brightness(0) invert(1);
			}
			#start-screen .logos .bdc {
				width: 130px;
				aspect-ratio: 8530.63 / 6813.3;
				background-image: url('%sveltekit.assets%/logo-bdc.svg');
				animation: start-in 0.7s 1.9s both;
			}
			#start-screen .logos .wyrdcry {
				width: 150px;
				aspect-ratio: 254.59 / 217.55;
				background-image: url('%sveltekit.assets%/logo-wyrdcry.svg');
				animation: start-in 0.7s 2.3s both;
			}
			@keyframes start-travel {
				from {
					transform: scale(1.3);
				}
			}
			@keyframes start-in {
				from {
					opacity: 0;
					transform: translateY(0.5em);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#start-screen,
				#start-screen * {
					animation: none !important;
					transition: none !important;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="start-screen" aria-hidden="true">
			<div class="ground"></div>
			<div class="etching"></div>
			<div class="title">
				<p><span>Your</span><span>Fantasy City Warbands</span><span>for</span></p>
				<div class="logos">
					<div class="bdc"></div>
					<div class="wyrdcry"></div>
				</div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
