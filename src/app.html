<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- The icons live in static/; %sveltekit.assets% carries the base path on
		     GitHub Pages. The manifest's own paths are relative to it. -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Warbands" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<script>
			(() => {
				let theme = null;
				try {
					theme = localStorage.getItem('theme');
				} catch {}
				if (theme !== 'light' && theme !== 'dark')
					theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
