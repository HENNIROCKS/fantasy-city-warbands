name: Something doesn't work
description: The app does something wrong, shows an error or gets stuck.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Fill in what you can, every detail helps to find the problem.
        Is a rule or a number wrong? Use **A rule or number is wrong** instead.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell it in your own words. An error message is welcome word for word.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How do I get there?
      description: What did you tap, one step per line, so I can do the same.
      placeholder: |
        1. Open a warband
        2. Turn a fighter's card over
        3. Tap …

  - type: dropdown
    id: area
    attributes:
      label: Where in the app?
      options:
        - Start page and saved warbands
        - Building a warband (game, warband, choice, fighters, finish)
        - The cards and a battle
        - The back of a card (notes, photo, stash, renown, dismiss)
        - After a battle (aftermath)
        - Files (export, import, PDF roster)
        - Guides, settings or the About page
        - Installing the app or updates
        - Look (light or dark mode, layout)
        - Something else
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Which game?
      options:
        - Black Death City
        - Wyrdcry
        - Doesn't depend on the game

  - type: input
    id: faction
    attributes:
      label: Which faction?
      description: Leave it empty if it doesn't matter.
      placeholder: Sisters of Sigmar

  - type: input
    id: version
    attributes:
      label: Version and build
      description: Tap the gear button at the top, then look under About, below the app's name.
      placeholder: Version 0.1 · Build 23 Oct 2026

  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari

  - type: dropdown
    id: installed
    attributes:
      label: Installed on the home screen or in the browser?
      options:
        - Installed on the home screen
        - In the browser
        - I don't know

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image in here, or paste it.
